<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ExpenseHelper - AI Audit Assistant</title>
<style>
  :root { --blue:#2563eb; --blue-dark:#1d4ed8; --blue-soft:#eff4ff; --green:#15803d; --red:#dc2626; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; --bg:#f1f5f9; --card:#fff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  svg { display:block; }
  .app { max-width:1440px; margin:0 auto; background:#f8fafc; min-height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; padding:18px 28px; border-bottom:1px solid var(--border); background:#fff; }
  .brand { display:flex; align-items:center; gap:14px; }
  .brand .logo { width:46px; height:46px; border-radius:12px; background:var(--blue); display:flex; align-items:center; justify-content:center; }
  .brand h1 { font-size:22px; font-weight:700; letter-spacing:-0.3px; }
  .brand p { font-size:13px; color:var(--muted); margin-top:2px; }
  .user { display:flex; align-items:center; gap:10px; color:var(--muted); font-weight:600; font-size:15px; }
  .user .avatar { width:40px; height:40px; border-radius:50%; background:var(--blue-soft); color:var(--blue); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
  .crumb { display:flex; align-items:center; justify-content:space-between; padding:16px 28px 4px; }
  .crumb .path { color:var(--muted); font-size:16px; }
  .crumb .path b { color:var(--text); }
  .status-pill { display:inline-flex; align-items:center; gap:8px; background:var(--blue-soft); color:var(--blue); font-weight:700; font-size:14px; padding:8px 16px; border-radius:999px; }
  .status-pill.approved { background:#dcfce7; color:var(--green); }
  .status-pill.rejected { background:#fee2e2; color:var(--red); }
  .status-pill .dot { width:9px; height:9px; border-radius:50%; background:currentColor; }
  .grid { display:grid; grid-template-columns:1fr; gap:24px; padding:16px 28px 96px; flex:1; align-items:start; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; display:flex; flex-direction:column; }
  .card h2 { display:flex; align-items:center; gap:10px; font-size:24px; font-weight:700; margin-bottom:20px; }
  .card h2.sub { margin-top:4px; }
  .card h2 .ic { color:var(--blue); }
  .divider { height:1px; background:var(--border); margin:24px 0; }
  .attach-list { display:flex; flex-direction:column; gap:12px; }
  .attach-item { border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .attach-row { display:flex; align-items:center; gap:10px; }
  .attach-row .num { color:var(--muted); font-weight:600; }
  .attach-row .fname { flex:1; word-break:break-all; font-size:16px; }
  .attach-row .ftype { font-size:11px; color:var(--muted); text-transform:uppercase; border:1px solid var(--border); border-radius:4px; padding:1px 6px; }
  .attach-preview { margin-top:12px; }
  .attach-preview img { max-width:100%; max-height:300px; object-fit:contain; border:1px solid var(--border); border-radius:10px; cursor:zoom-in; display:block; }
  .attach-preview.thumb { display:flex; align-items:center; gap:12px; }
  .attach-preview.thumb img { width:72px; height:72px; object-fit:cover; }
  .attach-preview.thumb .viewbig { color:var(--blue); font-weight:600; font-size:14px; cursor:pointer; }
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:18px 28px; }
  .field label { display:block; font-size:14px; color:var(--muted); margin-bottom:4px; }
  .field .val { font-size:18px; font-weight:500; }
  .field .val[contenteditable] { cursor:text; border-radius:4px; padding:2px 4px; margin:-2px -4px; transition:background .1s; outline:none; }
  .field .val[contenteditable]:hover { background:#f1f5f9; }
  .field .val[contenteditable]:focus { background:#eff6ff; box-shadow:0 0 0 2px #bfdbfe; }
  td[contenteditable] { cursor:text; outline:none; transition:background .1s; }
  td[contenteditable]:hover { background:#f1f5f9; }
  td[contenteditable]:focus { background:#eff6ff; box-shadow:inset 0 0 0 2px #bfdbfe; }
  .field .sel { font-size:18px; font-weight:500; border:1px solid var(--border); border-radius:6px; padding:6px 10px; background:#fff; cursor:pointer; outline:none; color:var(--text); }
  .field .sel:focus { border-color:var(--blue); box-shadow:0 0 0 2px #bfdbfe; }
  .mgr-badge { display:inline-flex; align-items:center; gap:8px; font-size:18px; font-weight:700; padding:8px 14px; border-radius:999px; cursor:pointer; user-select:none; border:2px solid transparent; }
  .mgr-badge.yes { background:#dcfce7; color:#15803d; border-color:#86efac; }
  .mgr-badge.no { background:#f1f5f9; color:#64748b; border-color:#e2e8f0; }
  .mgr-badge .ic { display:flex; }
  .mgr-badge:hover { filter:brightness(0.97); }
  .mgr-hint { font-size:11px; color:var(--muted); margin-top:4px; }
  table { width:100%; border-collapse:collapse; margin-top:8px; table-layout:fixed; }
  table th, table td { box-sizing:border-box; padding:14px 12px; text-align:left; vertical-align:top; border-bottom:1px solid var(--border); overflow-wrap:break-word; word-break:break-word; }
  table th { font-size:14px; color:var(--muted); font-weight:600; }
  table td { font-size:17px; line-height:1.45; }
  table th:nth-child(1), table td:nth-child(1) { width:26%; }
  table th:nth-child(2), table td:nth-child(2) { width:18%; }
  table th:nth-child(3), table td:nth-child(3) { width:36%; }
  table th:nth-child(4), table td:nth-child(4) { width:20%; text-align:right; white-space:nowrap; }
  table tr.total td { font-weight:700; background:#f8fafc; border-bottom:none; }
  table tr.total td:last-child { text-align:right; }

  /* Chat - larger */
  .chat { display:flex; flex-direction:column; min-height:640px; }
  .chat-head { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .chat-head .bot { width:46px; height:46px; border-radius:50%; background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; }
  .chat-head b { font-size:19px; }
  .messages { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding-right:4px; min-height:440px; }
  .bubble { max-width:88%; padding:16px 18px; border-radius:16px; font-size:var(--chat-font,15px); line-height:1.55; border:1px solid var(--border); background:#fff; white-space:pre-wrap; }
  .bubble.user { align-self:flex-end; background:var(--blue); color:#fff; border-color:var(--blue); }
  .bubble.demo-note { font-size:12px; color:var(--muted); border-style:dashed; background:#fafbfc; }
  .bubble.rec { font-weight:700; color:#0f172a; font-size:calc(var(--chat-font,15px) + 1px); }
  .bubble[contenteditable]:hover { box-shadow:0 0 0 2px #dbeafe; }
  .bubble[contenteditable]:focus { outline:none; box-shadow:0 0 0 2px #93c5fd; }
  .bubble .imgwrap { margin-top:4px; }
  .bubble .imgwrap img { max-width:220px; max-height:220px; border-radius:12px; border:1px solid rgba(255,255,255,.4); cursor:zoom-in; display:block; }
  .bubble .fileline { display:flex; align-items:center; gap:8px; font-size:14px; }
  #bold-tool { position:fixed; z-index:60; display:none; background:#0f172a; color:#fff; border:none; border-radius:8px; padding:6px 12px; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.25); }
  #bold-tool:hover { background:#1e293b; }
  #claim-switcher { position:fixed; right:0; top:50%; transform:translateY(-50%); z-index:70; display:flex; flex-direction:column; gap:6px; background:rgba(15,23,42,.9); padding:10px 8px; border-radius:12px 0 0 12px; }
  #claim-switcher .cs-title { color:#94a3b8; font-size:10px; text-align:center; margin-bottom:2px; }
  #claim-switcher button { border:none; background:#334155; color:#fff; width:64px; padding:8px 6px; border-radius:8px; font-size:12px; cursor:pointer; font-weight:600; }
  #claim-switcher button.active { background:#2563eb; }
  #claim-switcher button:hover { background:#475569; }
  #claim-switcher button.active:hover { background:#1d4ed8; }
  .composer { display:flex; gap:10px; margin-top:18px; align-items:center; }
  .composer input[type=text], .composer #chat-input { flex:1; border:1px solid var(--border); border-radius:14px; padding:16px 18px; font-size:17px; outline:none; }
  .composer #chat-input:focus { border-color:var(--blue); }
  .composer button { border:none; border-radius:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .composer #attach-btn { width:52px; height:52px; background:#eef2f7; color:var(--blue); }
  .composer #attach-btn:hover { background:#e2e8f0; }
  .composer .send { width:56px; height:52px; background:var(--blue); color:#fff; }
  .composer .send:hover { background:var(--blue-dark); }

  footer { position:sticky; bottom:0; display:flex; align-items:center; justify-content:space-between; padding:16px 28px; background:#fff; border-top:1px solid var(--border); }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:14px 26px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer; border:1px solid transparent; }
  .btn-info { color:var(--blue); border-color:#bfdbfe; background:#fff; }
  .btn-reject { color:var(--red); border-color:#fecaca; background:#fff; }
  .btn-approve { color:#fff; background:var(--green); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .right-actions { display:flex; gap:14px; }
  .modal { position:fixed; inset:0; background:rgba(15,23,42,.8); display:none; align-items:center; justify-content:center; z-index:50; }
  .modal.show { display:flex; }
  .modal img { max-width:92%; max-height:92%; border-radius:12px; }
  .modal .close { position:absolute; top:20px; right:28px; color:#fff; background:rgba(255,255,255,.15); border:none; width:44px; height:44px; border-radius:50%; font-size:22px; cursor:pointer; }
  @media (max-width:900px){ .grid { grid-template-columns:1fr; } .fields { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1"/><path d="M8 14h.01"/><path d="M16 14h.01"/><path d="M9 18h6"/></svg></div>
      <div><h1>ExpenseHelper</h1><p>AI Audit Assistant</p></div>
    </div>
    <div class="user"><div class="avatar" id="pid-badge">--</div><span>Auditor</span></div>
  </header>

  <div class="crumb">
    <div class="path">All Claims / <b>Claim #<span id="c-claimid-crumb">-</span></b></div>
    <div class="status-pill" id="status-pill"><span class="dot"></span> <span id="status-text">Audit Processing</span></div>
  </div>

  <div class="grid">
    <div class="card">
      <h2><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>Claim Summary</h2>
      <div class="fields">
        <div class="field"><label>Employee</label><div class="val" id="c-employee" contenteditable data-key="employee">-</div></div>
        <div class="field"><label>Claim ID</label><div class="val" id="c-claimId" contenteditable data-key="claimId">-</div></div>
        <div class="field"><label>Department</label><div class="val" id="c-department" contenteditable data-key="department">-</div></div>
        <div class="field"><label>Claim Date</label><div class="val" id="c-invoiceDate" contenteditable data-key="invoiceDate">-</div></div>
        <div class="field"><label>Trip Purpose</label><div class="val" id="c-tripPurpose" contenteditable data-key="tripPurpose">-</div></div>
        <div class="field"><label>Trip Dates</label><div class="val" id="c-tripDates" contenteditable data-key="tripDates">-</div></div>
        <div class="field"><label>Destination</label><div class="val" id="c-destination" contenteditable data-key="destination">-</div></div>
        <div class="field"><label>Submitted</label><div class="val" id="c-submitted" contenteditable data-key="submitted">-</div></div>
        <div class="field"><label>Manager Pre-Approval</label>
          <div class="mgr-badge no" id="c-managerApproval" data-val="No" title="Click to toggle">
            <span class="ic"></span><span class="mgr-text">No</span>
          </div>
          <div class="mgr-hint">click to toggle</div>
        </div>
      </div>

      <div class="divider"></div>

      <h2 class="sub"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></span>Expense Items</h2>
      <table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead>
        <tbody>
          <tr><td id="c-itemDate" contenteditable data-key="tripDates">-</td><td id="c-category" contenteditable data-key="category">-</td><td id="c-description" contenteditable data-key="description">-</td><td id="c-amount" contenteditable data-key="total">-</td></tr>
          <tr class="total"><td colspan="3">Total</td><td id="c-total">-</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card" id="attach-section">
      <h2 class="sub"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>Attachment</h2>
      <div class="attach-list" id="attach-list"></div>
    </div>

    <div class="card chat">
      <div class="chat-head">
        <div class="bot"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1"/><path d="M8 14h.01"/><path d="M16 14h.01"/><path d="M9 18h6"/></svg></div>
        <b>ExpenseHelper</b>
      </div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <button id="attach-btn" title="Attach invoice"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <input id="chat-input" type="text" placeholder="Ask a question..." />
        <button id="send-btn" class="send"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
        <input type="file" id="file-input" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" hidden multiple />
      </div>
    </div>
  </div>

  <footer>
    <button class="btn btn-info">Request More Info</button>
    <div class="right-actions">
      <button class="btn btn-info" id="audit-btn" style="border-color:#bfdbfe">Run Audit</button>
      <button class="btn btn-reject" id="reject-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="22" x2="4" y2="15"/><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V4s-1 1-4 1-5-2-8-2-4 1-4 1z"/></svg>Flag</button>
      <button class="btn btn-approve" id="approve-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Approve</button>
    </div>
  </footer>
</div>

<div class="modal" id="modal"><button class="close" id="modal-close">&times;</button><img id="modal-img" src="" /></div>
<button id="bold-tool" title="Bold selected text">B</button>
<div id="claim-switcher"><div class="cs-title">CLAIM</div></div>

<script>
var PID = sessionStorage.getItem("pid");
if (!PID) { location.href = "/"; }
document.getElementById("pid-badge").textContent = PID ? PID.slice(0,4).toUpperCase() : "--";

var CFG = null;                 // current config from /api/current
var chat = [];                  // chat history
var decision = null;
var messagesEl = document.getElementById("messages");

function logEvent(o){ o.pid=PID; fetch("/api/event",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)}).catch(function(){}); }
function setText(id,v){ var el=document.getElementById(id); if(el) el.textContent=(v==null||v==="")?"-":v; }
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function setManagerBadge(val){
  var el=document.getElementById("c-managerApproval"); if(!el) return;
  el.setAttribute("data-val", val);
  el.className = "mgr-badge " + (val==="Yes"?"yes":"no");
  var check = "<svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>";
  var dash = "<svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round'><line x1='5' y1='12' x2='19' y2='12'/></svg>";
  el.querySelector(".ic").innerHTML = (val==="Yes"?check:dash);
  el.querySelector(".mgr-text").textContent = val;
}

function renderInvoice(){
  var f=CFG.fields||{};
  setText("c-claimid-crumb", f.claimId);
  setText("c-employee",f.employee); setText("c-claimId",f.claimId);
  setText("c-department",f.department); setText("c-invoiceDate",f.invoiceDate);
  setText("c-tripPurpose",f.tripPurpose); setText("c-tripDates",f.tripDates);
  setText("c-destination",f.destination); setText("c-submitted",f.submitted);
  setText("c-itemDate",f.tripDates); setText("c-category",f.category);
  setText("c-description",f.description);
  setText("c-amount", f.total||(f.amount?"$"+f.amount:"-"));
  setText("c-total", f.total||(f.amount?"$"+f.amount:"-"));
  setManagerBadge(f.managerApproval==="Yes"?"Yes":"No");
  renderAttachments();
  updateStatus();
}

function renderAttachments(){
  var section=document.getElementById("attach-section");
  var list=document.getElementById("attach-list"); list.innerHTML="";
  var mode=(CFG.attachMode)||"large";
  if(mode==="hidden"){ if(section) section.style.display="none"; return; }
  if(section) section.style.display="";
  (CFG.attachments||[]).forEach(function(a,i){
    var item=document.createElement("div"); item.className="attach-item";
    var typeTag=(a.kind!=="image")?"<span class='ftype'>"+a.kind+"</span>":"";
    var head="<div class='attach-row'><span class='num'>"+(i+1)+".</span><span class='fname'>"+escapeHtml(a.name)+"</span>"+typeTag+"</div>";
    var body="";
    if(a.kind==="image"){
      if(mode==="large") body="<div class='attach-preview'><img src='"+a.src+"'/></div>";
      else if(mode==="thumb") body="<div class='attach-preview thumb'><img src='"+a.src+"'/><span class='viewbig'>Click to view</span></div>";
      // mode==="filename" -> no body
    }
    item.innerHTML=head+body;
    var img=item.querySelector("img");
    if(img) img.onclick=function(){ showModal(a.src); };
    list.appendChild(item);
  });
}

function updateStatus(){
  var pill=document.getElementById("status-pill"), txt=document.getElementById("status-text");
  pill.className="status-pill";
  if(decision==="approved"){ pill.classList.add("approved"); txt.textContent="Approved"; }
  else if(decision==="rejected"){ pill.classList.add("rejected"); txt.textContent="Flagged"; }
  else { txt.textContent="Audit Processing"; }
  var done=!!decision;
  document.getElementById("approve-btn").disabled=done;
  document.getElementById("reject-btn").disabled=done;
}

function addBubble(text,who,isNote,extraClass,asHtml){
  var b=document.createElement("div");
  b.className="bubble "+(who==="user"?"user":"")+(isNote?" demo-note":"")+(extraClass?(" "+extraClass):"");
  if(asHtml){ b.innerHTML=text; } else { b.textContent=text; }
  if(who!=="user" && !b.querySelector("img")){ b.setAttribute("contenteditable","true"); b.setAttribute("spellcheck","false"); }
  messagesEl.appendChild(b); messagesEl.scrollTop=messagesEl.scrollHeight; return b;
}

function initChat(){
  messagesEl.innerHTML="";
  addBubble("Audit processing.\n\nThis claim could be valid.\n\nBut my check does not always catch every rule in the Guide.\n\nPlease read the details and confirm they meet your manual.","assistant");
}

async function sendMessage(text){
  if(!text.trim()) return;
  addBubble(text,"user"); chat.push({role:"user",content:text});
  var thinking=addBubble("...","assistant");
  try{
    var r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pid:PID,invoiceId:CFG.claimId,message:text,claim:CFG.fields,history:chat})});
    var data=await r.json(); thinking.textContent=data.reply; chat.push({role:"assistant",content:data.reply});
  }catch(e){ thinking.textContent="Could not reach the server ("+e.message+")."; }
}
document.getElementById("send-btn").onclick=function(){ var inp=document.getElementById("chat-input"); sendMessage(inp.value); inp.value=""; };
document.getElementById("chat-input").addEventListener("keydown",function(e){ if(e.key==="Enter"){ sendMessage(e.target.value); e.target.value=""; } });

function bindEditable(){
  document.querySelectorAll("[contenteditable][data-key]").forEach(function(el){
    el.addEventListener("blur",function(){
      var key=el.getAttribute("data-key"), val=el.textContent.trim(), f=CFG.fields;
      if(key==="total"){ f.total=val; var n=val.replace(/[^0-9.]/g,""); if(n) f.amount=n; } else { f[key]=val; }
      if(key==="tripDates"){ setText("c-tripDates",val); setText("c-itemDate",val); }
      if(key==="total"){ setText("c-total",val); }
      if(key==="claimId"){ setText("c-claimid-crumb",val); }
    });
  });
  var mgr=document.getElementById("c-managerApproval");
  if(mgr) mgr.addEventListener("click",function(){
    var next=(mgr.getAttribute("data-val")==="Yes")?"No":"Yes";
    setManagerBadge(next); CFG.fields.managerApproval=next;
  });
}

function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

document.getElementById("audit-btn").onclick=async function(){
  var btn=this; btn.disabled=true;
  logEvent({type:"run_audit",invoiceId:CFG.claimId});
  addBubble("Audit processing...","assistant"); await sleep(600);
  addBubble("Audit complete!","assistant"); await sleep(300);
  var recLabel = CFG.recommendation==="Flag" ? "Flag" : "Approve";
  addBubble("Audit recommendation: "+recLabel,"assistant",false,"rec"); await sleep(300);
  var msg=(CFG.reason?escapeHtml(CFG.reason)+"\n":"")+"<b>"+escapeHtml(CFG.framing)+"</b>";
  addBubble(msg,"assistant",false,null,true);
  btn.disabled=false;
};

document.getElementById("approve-btn").onclick=function(){ decide("approved"); };
document.getElementById("reject-btn").onclick=function(){ decide("rejected"); };
function decide(kind){
  decision=kind; logEvent({type:"decision",invoiceId:CFG.claimId,decision:kind}); updateStatus();
  addBubble("You marked this claim as "+(kind==="rejected"?"FLAGGED":"APPROVED")+".","assistant",true);
}

var modal=document.getElementById("modal"), modalImg=document.getElementById("modal-img");
function showModal(url){ modalImg.src=url; modal.classList.add("show"); }
document.getElementById("modal-close").onclick=function(){ modal.classList.remove("show"); };
modal.addEventListener("click",function(e){ if(e.target===modal) modal.classList.remove("show"); });

// paperclip upload (participant can still add their own; shows in chat)
var fileInput=document.getElementById("file-input");
document.getElementById("attach-btn").onclick=function(){ fileInput.click(); };
fileInput.addEventListener("change",function(e){ handleFiles(e.target.files); fileInput.value=""; });
function fileKind(file){ if(file.type.startsWith("image/")) return "image"; if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)) return "pdf"; if(/\.docx?$/i.test(file.name)) return "docx"; return "other"; }
function handleFiles(fileList){
  var files=Array.prototype.slice.call(fileList||[]); if(!files.length) return;
  files.forEach(function(file){
    var kind=fileKind(file);
    if(kind==="image"){ var url=URL.createObjectURL(file); var b=addBubble("","user",false,null,true); b.innerHTML="<div class='fileline'>"+escapeHtml(file.name)+"</div><div class='imgwrap'><img src='"+url+"'/></div>"; b.querySelector("img").onclick=function(){ showModal(url); }; }
    else { addBubble("Attached: "+file.name,"user"); }
    logEvent({type:"self_upload",invoiceId:CFG.claimId,filename:file.name,kind:kind});
  });
}

// Select text inside a chat bubble -> show floating Bold button
var boldTool=document.getElementById("bold-tool");
var lastRange=null;
document.addEventListener("selectionchange",function(){
  var sel=window.getSelection();
  if(!sel||sel.isCollapsed||!sel.rangeCount){ boldTool.style.display="none"; return; }
  var range=sel.getRangeAt(0);
  var node=range.commonAncestorContainer;
  var el=(node.nodeType===3)?node.parentElement:node;
  var bubble=el && el.closest ? el.closest(".bubble") : null;
  if(bubble && bubble.getAttribute("contenteditable")==="true"){
    var rect=range.getBoundingClientRect();
    boldTool.style.display="block";
    boldTool.style.left=(rect.left+rect.width/2-16)+"px";
    boldTool.style.top=(rect.top-40)+"px";
    lastRange=range;
  } else { boldTool.style.display="none"; }
});
boldTool.addEventListener("mousedown",function(e){
  e.preventDefault();
  if(lastRange){ var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(lastRange); }
  document.execCommand("bold");
  boldTool.style.display="none";
});

// init: load current config
var CURRENT_CLAIM_KEY=null;
var CLAIM_KEYS=[];

function loadCurrent(claimKey){
  var url = claimKey ? ("/api/current?claim="+encodeURIComponent(claimKey)) : "/api/current";
  return fetch(url).then(function(r){return r.json();}).then(function(d){
    CFG=d; CURRENT_CLAIM_KEY=d.claimId; decision=null; chat=[];
    document.documentElement.style.setProperty("--chat-font", (d.chatFont||15)+"px");
    if(d.chatBold){ var st=document.getElementById("boldstyle"); if(!st){ st=document.createElement("style"); st.id="boldstyle"; st.textContent=".messages .bubble{font-weight:700;}"; document.head.appendChild(st); } }
    else { var ex=document.getElementById("boldstyle"); if(ex) ex.remove(); }
    renderInvoice(); bindEditable(); initChat();
    highlightSwitcher();
  });
}

// Build the side switcher from the claim list
fetch("/api/claims").then(function(r){return r.json();}).then(function(d){
  var sw=document.getElementById("claim-switcher");
  (d.claims||[]).forEach(function(c,i){
    CLAIM_KEYS.push(c.id);
    var btn=document.createElement("button");
    btn.setAttribute("data-key",c.id);
    var short=c.label.split(" - ")[0];
    btn.textContent=(i+1)+". "+short;
    btn.onclick=function(){ loadCurrent(c.id); };
    sw.appendChild(btn);
  });
  loadCurrent(); // load default (admin-selected)
});

function highlightSwitcher(){
  document.querySelectorAll("#claim-switcher button").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-key")===CURRENT_CLAIM_KEY);
  });
}

// Keyboard shortcuts 1-4 to switch claim (ignored while editing text)
document.addEventListener("keydown",function(e){
  var t=e.target;
  if(t && (t.isContentEditable || t.tagName==="INPUT" || t.tagName==="TEXTAREA")) return;
  var n=parseInt(e.key,10);
  if(n>=1 && n<=CLAIM_KEYS.length){ loadCurrent(CLAIM_KEYS[n-1]); }
});
</script>
